[package]
name = "horizon-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop", "sync"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Git sync. On Android there is no system OpenSSL, so a device build uses
# `sync-vendored` instead (it compiles OpenSSL with the NDK).
sync = ["dep:git2", "git2/https"]
sync-vendored = ["sync", "git2/vendored-openssl"]

[dependencies]
horizon-core = { path = "../horizon-core" }
dioxus-icons = "0.1"
dioxus = { version = "0.7.10", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
    "launch",
    "document",
    "logger",
    "mounted",
] }
chrono.workspace = true
git2 = { version = "0.21", optional = true, default-features = false, features = [
    "vendored-libgit2",
    "ssh",
] }
serde_json.workspace = true
dirs = "6"
tokio = { version = "1", features = ["time"] }


# The desktop launcher builds its own menu bar; `dioxus/desktop` re-exports the
# same crate, so this adds no second copy of the renderer.
[target.'cfg(all(not(target_os = "android"), not(target_os = "ios")))'.dependencies]
dioxus-desktop = "0.7.10"
# The folder picker on first run. rfd's backend is decided by whichever feature is
# on: dioxus-desktop already turns on `xdg-portal`, and rfd refuses to build with
# both backends, so this crate names none and inherits the portal.
rfd = { version = "0.17", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(desktop_shell)'] }

[target.'cfg(target_os = "android")'.dependencies]
sysdirs = { version = "0.9", features = ["android-auto"] }
jni = "0.21"
ndk-context = "0.1"